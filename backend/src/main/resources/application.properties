spring.application.name=ShopSphere
server.port=8080

# PostgreSQL — supply via environment variables (see backend/.env.example)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/shopsphere}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Persistence — dev schema sync. Hibernate adds missing tables/columns; it never drops or deletes data.
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# JWT — supply JWT_SECRET via environment (min 32 characters). Never commit real secrets.
shopsphere.security.jwt.secret=${JWT_SECRET}
shopsphere.security.jwt.issuer=${JWT_ISSUER:https://shopsphere.local}
shopsphere.security.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:60}

# CORS — leave empty/unset when using the Vite dev proxy. Set explicit origins only when the SPA
# is served from a different host (never use * with credentials in production).
shopsphere.security.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}

# Pricing & Tax — default tax rate (0.00 = 0%, override with TAX_RATE env var e.g. 0.18 for 18%)
shopsphere.pricing.tax-rate=${TAX_RATE:0.00}

# Email verification — new accounts must verify their email before login.
# Codes expire after VERIFICATION_CODE_TTL_MINUTES (default 10).
shopsphere.auth.email-verification-required=${EMAIL_VERIFICATION_REQUIRED:true}
shopsphere.auth.verification-code-ttl-minutes=${VERIFICATION_CODE_TTL_MINUTES:10}

# SMTP (optional) — set MAIL_HOST/MAIL_USERNAME/MAIL_PASSWORD to deliver real verification emails.
# Without MAIL_HOST the code is logged to the backend console instead (local dev fallback).
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
