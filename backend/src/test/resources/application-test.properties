# In-memory database for automated tests only (not used at runtime)
spring.datasource.url=jdbc:h2:mem:shopsphere;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

# Test-only JWT secret (32+ chars). Not used in production.
shopsphere.security.jwt.secret=test-jwt-secret-key-32bytes-min-ok
shopsphere.security.jwt.issuer=https://shopsphere-test.local
shopsphere.security.jwt.expiration-minutes=60
